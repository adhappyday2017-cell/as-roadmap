<title>Страницы ivlieva.ru</title>
<style>
:root{--bg:#F6F8F7;--surface:#fff;--ink:#16242C;--soft:#5C6C75;--line:#E3E8E6;--green:#0E7C66;--red:#B4482A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 28px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(22,36,44,.06)}
h1{font-size:21px;margin:0 0 6px}
p{color:var(--soft);font-size:14px;margin:0 0 18px;line-height:1.45}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--soft);margin-bottom:16px}
button{width:100%;font:inherit;font-weight:700;font-size:16px;padding:12px;border:0;border-radius:100px;background:var(--green);color:#fff;cursor:pointer}
.err{color:var(--red);font-size:14px;min-height:20px;margin:10px 0 0}
</style>
</head>

    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(D.salt), iterations:D.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(D.iv)}, key, b(D.ct));
    if (remember) store(KEY, pw);
    var html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }
  var saved = read(KEY);
  if (saved) open(saved, true).catch(function(){ store(KEY, null); });
  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    var go = document.getElementById('go'); go.disabled = true; go.textContent = 'Открываю…';
    document.getElementById('err').textContent = '';
    open(pw, document.getElementById('rm').checked).catch(function(){
      go.disabled = false; go.textContent = 'Открыть';
      document.getElementById('err').textContent = 'Пароль не подошёл. Проверьте и попробуйте ещё раз.';
    });
  });
})();
</script>
