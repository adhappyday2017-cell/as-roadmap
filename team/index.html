<style>

body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}

</style>

  var KEY = 'as_team_pw';
  var b = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };

  async function open(pw, remember){
